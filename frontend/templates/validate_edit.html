<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ProVR Edit Validation</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
    }
    #app {
      display: grid;
      grid-template-columns: 360px 1fr;
      width: 100%;
      height: 100%;
    }
    #panel {
      padding: 14px;
      border-right: 1px solid #374151;
      background: #0f172a;
      overflow: auto;
    }
    #viewport {
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    button, input, select {
      box-sizing: border-box;
      width: 100%;
      margin: 4px 0;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1f2937;
      color: #f9fafb;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: 600;
    }
    button.secondary {
      background: #374151;
      border-color: #4b5563;
    }
    button.warn {
      background: #b45309;
      border-color: #d97706;
    }
    #status {
      padding: 8px;
      border-radius: 8px;
      background: #1f2937;
      margin-bottom: 10px;
      font-size: 13px;
      white-space: pre-wrap;
    }
    #status[data-kind="ok"] { background: #064e3b; }
    #status[data-kind="warn"] { background: #78350f; }
    #status[data-kind="error"] { background: #7f1d1d; }
    pre {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
      max-height: 38vh;
      font-size: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h2>ProVR Edit Validation</h2>
    <div id="status">ready</div>

    <label>Load PDB / CIF / mmCIF</label>
    <input id="structureFileInput" type="file" accept=".pdb,.ent,.cif,.mmcif,.mif" />

    <label>Translation vector</label>
    <div class="row">
      <input id="tx" value="5" />
      <input id="ty" value="0" />
    </div>
    <input id="tz" value="0" />

    <button id="moveFirstAtomButton">Move first atom</button>
    <button id="moveFirstResidueButton">Move first residue</button>
    <button id="moveFirstRangeButton">Move first 5 residues</button>

    <div class="row">
      <button id="undoButton" class="secondary">Undo</button>
      <button id="redoButton" class="secondary">Redo</button>
    </div>

    <button id="exportButton">Download PDB</button>
    <button id="validateButton" class="secondary">Validate edit</button>
    <button id="centerButton" class="secondary">Center model</button>

    <h3>Console helpers</h3>
    <pre>
provr.edit.moveFirstAtom([5,0,0])
provr.edit.moveFirstResidue([5,0,0])
provr.edit.moveFirstResidueRange(5, [5,0,0])
provr.edit.undo()
provr.edit.redo()
provr.edit.exportPDB()
provr.edit.printFirstAtoms(10)
provr.edit.validate()
    </pre>

    <h3>Summary</h3>
    <pre id="summary">{}</pre>
  </aside>

  <main id="viewport"></main>
</div>

<script type="module" src="../static/validation/validate_edit.js"></script>
</body>
</html>
