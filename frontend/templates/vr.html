<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ProVR Spatial Workspace</title>
    <style>
        :root {
            --bg0: #020617;
            --bg1: #07111f;
            --glass: rgba(255,255,255,.09);
            --glass-strong: rgba(255,255,255,.14);
            --stroke: rgba(255,255,255,.18);
            --text: rgba(248,250,252,.96);
            --muted: rgba(203,213,225,.72);
            --accent: #7dd3fc;
            --success: #86efac;
            --danger: #fb7185;
            --shadow: 0 24px 80px rgba(0,0,0,.42);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 16% 10%, rgba(56,189,248,.20), transparent 28%),
                radial-gradient(circle at 78% 26%, rgba(134,239,172,.10), transparent 30%),
                linear-gradient(135deg, var(--bg0), var(--bg1));
        }

        #app {
            display: grid;
            grid-template-columns: 370px 1fr;
            width: 100%;
            height: 100%;
        }

        #shell {
            padding: 18px;
            backdrop-filter: blur(28px) saturate(140%);
            background: linear-gradient(180deg, rgba(15,23,42,.78), rgba(15,23,42,.54));
            border-right: 1px solid var(--stroke);
            overflow: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .orb {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: radial-gradient(circle at 28% 24%, #ffffff, #7dd3fc 35%, #2563eb 72%, #111827);
            box-shadow: 0 0 34px rgba(125,211,252,.46);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -.02em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .card {
            border: 1px solid var(--stroke);
            background: var(--glass);
            border-radius: 24px;
            padding: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 12px;
            letter-spacing: .09em;
            color: rgba(226,232,240,.86);
            text-transform: uppercase;
        }

        button, input, select {
            width: 100%;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.08);
            color: var(--text);
            border-radius: 15px;
            padding: 10px 12px;
            font: inherit;
            outline: none;
        }

        input::placeholder { color: rgba(203,213,225,.40); }
        input[type=file] { cursor: pointer; color: var(--muted); }

        button {
            cursor: pointer;
            font-weight: 650;
            transition: transform .18s ease, background .18s ease, border .18s ease, box-shadow .18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.13);
            box-shadow: 0 10px 30px rgba(0,0,0,.22);
        }

        button.primary {
            background: linear-gradient(135deg, rgba(125,211,252,.36), rgba(134,239,172,.24));
            border-color: rgba(125,211,252,.44);
        }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .row { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 8px 0; }

        label {
            display: block;
            margin: 8px 0 4px;
            color: var(--muted);
            font-size: 12px;
        }

        #viewport {
            position: relative;
            min-width: 0;
            height: 100%;
        }

        #status {
            min-height: 42px;
            color: rgba(226,232,240,.92);
            line-height: 1.45;
            font-size: 13px;
            white-space: pre-wrap;
        }

        #status[data-kind="error"] { color: var(--danger); }
        #status[data-kind="ok"] { color: var(--success); }
        #status[data-kind="info"] { color: var(--accent); }

        #summary {
            max-height: 260px;
            overflow: auto;
            margin: 0;
            padding: 10px;
            border-radius: 14px;
            background: rgba(2,6,23,.64);
            color: rgba(203,213,225,.82);
            font-size: 11px;
            line-height: 1.45;
        }

        @media (max-width: 980px) {
            #app { grid-template-columns: 1fr; }
            #shell { max-height: 46vh; border-right: none; border-bottom: 1px solid var(--stroke); }
            #viewport { height: 54vh; }
        }
    </style>
</head>
<body>
<div id="app">
    <aside id="shell">
        <div class="brand">
            <div class="orb"></div>
            <div>
                <h1>ProVR Spatial Workspace</h1>
                <div class="subtitle">VR-first human-AI protein co-design</div>
            </div>
        </div>

        <section class="card">
            <h2>Structure</h2>
            <div class="row">
                <input id="structureFileInput" type="file" accept=".pdb,.ent,.cif,.mmcif,.mif"/>
                <div class="grid2">
                    <button id="loadDemoButton">Load Demo</button>
                    <button id="centerButton">Center</button>
                </div>
                <button id="enterVRButton" class="primary">Enter VR</button>
            </div>
        </section>

        <section class="card">
            <h2>View</h2>
            <div class="grid2">
                <button id="toggleBallStick">Ball-stick</button>
                <button id="toggleCartoon">Cartoon</button>
                <button id="toggleLine">Line</button>
                <button id="toggleSurface">Surface</button>
            </div>
            <label>Color scheme</label>
            <select id="colorScheme">
                <option value="chain" selected>Chain</option>
                <option value="element">Element</option>
                <option value="kind">Residue kind</option>
                <option value="sse">SSE</option>
            </select>
        </section>

        <section class="card">
            <h2>Edit Scope</h2>
            <select id="editScope">
                <option value="atom">Atom</option>
                <option value="residue" selected>Residue</option>
                <option value="residueRange">Residue range</option>
                <option value="chain">Chain</option>
                <option value="protein">Protein</option>
                <option value="surfaceInspect">Surface inspection</option>
            </select>
            <label>Residue window</label>
            <input id="residueWindow" value="5"/>
            <div class="grid2">
                <button id="undoButton">Undo</button>
                <button id="redoButton">Redo</button>
            </div>
        </section>

        <section class="card">
            <h2>Surface</h2>
            <div class="grid2">
                <button id="surfaceFullButton">Full Surface</button>
                <button id="surfaceLayerButton">Layer/Range</button>
            </div>
            <label>Chain</label>
            <input id="surfaceChain" placeholder="A"/>
            <label>Range</label>
            <input id="surfaceRange" placeholder="20-80"/>
            <label>Opacity</label>
            <input id="surfaceOpacity" value="0.46"/>
            <label>Color mode</label>
            <select id="surfaceColorMode">
                <option value="range" selected>Range</option>
                <option value="residue">Residue</option>
                <option value="atom">Atom</option>
            </select>
            <button id="surfaceResetButton">Reset Surface Transform</button>
        </section>

        <section class="card">
            <h2>Export</h2>
            <button id="exportButton" class="primary">Export Edited PDB</button>
        </section>

        <section class="card">
            <h2>Status</h2>
            <div id="status" data-kind="info">Booting ProVR…</div>
        </section>

        <section class="card">
            <h2>Developer Summary</h2>
            <pre id="summary">{}</pre>
        </section>
    </aside>

    <main id="viewport"></main>
</div>

<script type="module" src="../static/vr/workspace/ProVRVRWorkspaceBootstrap.js"></script>
</body>
</html>
