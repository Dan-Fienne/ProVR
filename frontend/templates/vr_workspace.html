<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ProVR VR</title>
    <script type="importmap">
        {
          "imports": {
            "three": "/static/libs/three.module.js",
            "three/addons/": "/static/libs/"
          }
        }
    </script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f8fbff;
            color: #071827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        #viewport {
            position: fixed;
            inset: 0
        }

        #landing {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none
        }

        .card {
            width: min(680px, calc(100vw - 44px));
            padding: 44px;
            border-radius: 42px;
            text-align: center;
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(255, 255, 255, .88);
            box-shadow: 0 38px 130px rgba(15, 23, 42, .10);
            backdrop-filter: blur(28px);
            pointer-events: auto
        }

        h1 {
            margin: 0 0 14px;
            font-size: 70px;
            line-height: .9;
            letter-spacing: -.08em;
            font-weight: 850
        }

        p {
            max-width: 560px;
            margin: 0 auto 28px;
            color: rgba(38, 56, 79, .72);
            line-height: 1.62
        }

        button {
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 999px;
            padding: 18px 34px;
            min-width: 220px;
            background: rgba(255, 255, 255, .68);
            backdrop-filter: blur(20px);
            font-weight: 800;
            font-size: 17px;
            color: #071827;
            box-shadow: 0 24px 80px rgba(15, 23, 42, .10);
            cursor: pointer
        }

        button:hover {
            background: rgba(255, 255, 255, .88)
        }

        #status {
            margin-top: 18px;
            font-size: 13px;
            color: rgba(38, 56, 79, .60);
            min-height: 20px
        }

        #status[data-kind="error"] {
            color: #c73550
        }

        #status[data-kind="ok"] {
            color: #0f8a5c
        }

        #summary {
            display: none
        }
    </style>
</head>
<body>
<div id="viewport"></div>
<section id="landing">
    <div class="card">
        <h1>ProVR</h1>
        <p>Enter VR, summon a transparent horizontal liquid-glass menu, and operate proteins with visible ray
            feedback.</p>
        <button id="enterVRButton">Enter VR</button>
        <div id="status" data-kind="info">Menu summons 0.7m in front of your current view.</div>
    </div>
</section>
<pre id="summary">{}</pre>
<script type="module" src="../static/vr/workspace/ProVRVRWorkspace.js"></script>
</body>
</html>
